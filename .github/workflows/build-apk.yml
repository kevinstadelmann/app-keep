name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Restore signing key from secrets
        env:
          KEEP_KEYSTORE_BASE64: ${{ secrets.KEEP_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEEP_KEYSTORE_BASE64" ]; then
            mkdir -p android/signing
            echo "$KEEP_KEYSTORE_BASE64" | base64 --decode > android/signing/keep.p12
          else
            echo "::warning::No signing secrets set. This APK uses a throwaway key and cannot be updated in place."
          fi

      - name: Build signed APK
        env:
          KEEP_STORE_PASSWORD: ${{ secrets.KEEP_STORE_PASSWORD }}
        run: gradle -p android assembleRelease -PbuildNumber=${{ github.run_number }} --no-daemon

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk keep.apk

      - uses: actions/upload-artifact@v4
        with:
          name: keep-apk
          path: keep.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "v1.0.${{ github.run_number }}" keep.apk
          --target "${{ github.sha }}"
          --title "Keep 1.0.${{ github.run_number }}"
          --notes "Download keep.apk on your Android phone and open it to install."

  # Publishes the download page (site/index.html) with the newest APK next to it.
  # Needs Pages switched on once: Settings -> Pages -> Source: GitHub Actions.
  pages:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: keep-apk
          path: _site

      - name: Assemble the download page
        run: |
          cp site/index.html _site/index.html
          cp icons/keep-512.png _site/icon.png
          sed -i "s/__VERSION__/1.0.${{ github.run_number }}/; s/__DATE__/$(date -u '+%-d %B %Y')/" _site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
